[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "camel-ai[eigent] @ git+https://github.com/camel-ai/camel.git@feature/workforce-configurable-fail-handling",
    "fastapi>=0.141.1",
    "fastapi-babel>=1.0.0",
    "uvicorn[standard]>=0.52.4",
    "pydantic-i18n>=0.4.5",
    "python-dotenv>=1.2.3",
    "httpx[socks]>=0.28.1",
    "pydash>=8.1.0",
    "inflection>=0.5.1",
    "aiofiles>=25.1.0",
    "openai>=3.11.0,<4",
    "traceroot>=0.0.7",
    "nodejs-wheel>=24.19.0",
    "numpy>=2.2.6,<3.0.0",
    "debugpy>=1.8.21",
]


[dependency-groups]
dev = [
    "babel>=2.18.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "B006", # forbid def demo(mutation = [])
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
