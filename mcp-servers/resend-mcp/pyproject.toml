[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resend-mcp"
version = "1.0.0"
description = "Resend MCP Server - Transactional email service integration"
authors = [{name = "The Pauli Effect", email = "contact@paulieffect.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "resend", "email", "transactional", "smtp", "ai-assistant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Email",
]

dependencies = [
    "mcp",
    "starlette",
    "uvicorn",
    "aiohttp",
    "resend>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/paulieffect/resend-mcp"
Repository = "https://github.com/paulieffect/resend-mcp"
Issues = "https://github.com/paulieffect/resend-mcp/issues"

[project.scripts]
resend-mcp = "resend_mcp.server:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
