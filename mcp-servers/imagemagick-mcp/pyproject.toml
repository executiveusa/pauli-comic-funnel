[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imagemagick-mcp"
version = "1.0.0"
description = "ImageMagick MCP Server - Image manipulation via MCP"
authors = [{name = "The Pauli Effect", email = "dev@paulieffect.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "imagemagick", "image", "processing", "manipulation", "ai-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion"
]

dependencies = [
    "mcp",
    "starlette",
    "uvicorn",
    "Wand>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/pauli-effect/imagemagick-mcp"
Repository = "https://github.com/pauli-effect/imagemagick-mcp"

[project.scripts]
imagemagick-mcp = "imagemagick_mcp:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
