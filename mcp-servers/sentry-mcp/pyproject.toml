[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentry-mcp"
version = "1.0.0"
description = "Sentry MCP Server - Error tracking and performance monitoring"
authors = [{name = "Pauli Team", email = "dev@pauli.dev"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "sentry", "error-tracking", "monitoring", "performance", "apm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring"
]

dependencies = [
    "mcp",
    "starlette",
    "uvicorn",
    "aiohttp",
    "sentry-sdk>=1.40.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/paulieffect/sentry-mcp"
Repository = "https://github.com/paulieffect/sentry-mcp"

[project.scripts]
sentry-mcp = "sentry_mcp.server:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
